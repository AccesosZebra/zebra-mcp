<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ZEBRA · Reporte de Métricas · Acceso</title>
<link rel="icon" type="image/x-icon" sizes="32x32" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* Réplica del login de Zebra Reports AI (Analisis-pitahaya/login.html): misma tarjeta, mismo orden.
   Arriba, la puerta del cliente (correo y contraseña); abajo, la del equipo (Google). */
:root{--bg:#0A0A0A;--surface:#161616;--text:#FFFFFF;--muted:rgba(255,255,255,.6);--border:rgba(255,255,255,.12);--danger:#F1928C;--sans:'Inter','Helvetica Neue',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
::selection{background:rgba(255,255,255,.22)}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:34px 30px 30px;text-align:center;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
/* El lockup de la barra lateral; JetBrains Mono solo aquí. */
h1.lockup{margin:0 0 20px;font-weight:inherit}
.logo{display:block;width:130px;height:auto;margin:0 auto;color:var(--text)}
.brand-sub{display:block;margin-top:6px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.22em;color:var(--muted);margin:0 0 8px}
p.sub{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 24px;text-wrap:balance}
form{text-align:left}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.field .wrap{position:relative}
.field input{width:100%;padding:11px 13px;font:13px var(--sans);background:var(--bg);color:var(--text);border:.5px solid var(--border);border-radius:8px;caret-color:var(--text)}
.field input::placeholder{color:rgba(255,255,255,.28)}
.field input:focus{outline:none;border-color:rgba(255,255,255,.35)}
#pw-pass{padding-right:40px}
.peek{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;line-height:0;border-radius:6px}
.peek:hover{color:var(--text)}
.peek:focus-visible,.primary:focus-visible,.alt a:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--text)}
.primary{width:100%;margin-top:6px;padding:12px;font:600 13px var(--sans);cursor:pointer;background:var(--text);color:var(--bg);border:none;border-radius:100px}
.primary:disabled{opacity:.6;cursor:default}
/* Abajo, el acceso del equipo Zebra: solo con Google. */
.staff{margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
.staff .eyebrow{margin-bottom:14px}
/* El iframe de Google es de esquema claro: si el contenedor hereda "dark", el navegador lo pinta
   con fondo blanco opaco. Con el mismo esquema que el iframe, su fondo queda transparente. */
.gbtn{display:flex;justify-content:center;min-height:44px;color-scheme:light}
.gbtn:empty{min-height:0}
.hint{margin:14px 0 0;font-size:12px;letter-spacing:.04em;color:var(--muted)}
.hint b{color:var(--text);font-weight:600}
.loading{font-size:12px;color:var(--muted)}
/* Respaldo si el botón de Google no se pinta (p. ej. dominio aún no autorizado en Google Cloud). */
.alt{margin:10px 0 0;font-size:12px;color:var(--muted)}
.alt a{color:var(--text);text-underline-offset:3px;border-radius:4px}
.error{display:none;margin-top:16px;font-size:13px;line-height:1.5;color:var(--danger);background:rgba(241,146,140,.08);border:1px solid rgba(241,146,140,.25);border-radius:10px;padding:10px 12px;text-align:left}
.error.show{display:block}
</style>
</head>
<body>
  <main class="card">
    <h1 class="lockup">
    <svg class="logo" viewBox="0 0 244 39" role="img" aria-label="Zebra" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M131.868 25.8267C131.001 22.2349 128.485 20.097 124.971 18.8142C125.449 18.5149 125.839 18.2583 126.186 18.0445C130.394 15.3079 131.478 10.305 128.702 6.11461C126.533 2.86489 123.323 1.28279 119.462 1.15451C114.517 1.02623 109.616 1.11175 104.671 1.11175C104.454 1.11175 104.193 1.15451 103.933 1.15451V38.0987C104.193 38.0987 104.367 38.1415 104.584 38.1415C109.919 38.1415 115.255 38.1842 120.59 38.0987C121.978 38.0987 123.41 37.7994 124.711 37.3718C130.003 35.7042 133.04 30.7013 131.868 25.8267ZM127.791 28.1358C127.661 31.4282 124.841 34.2076 121.198 34.2931C116.946 34.4214 112.695 34.3359 108.314 34.3359V4.9601C112.218 4.9601 116.079 4.83182 119.94 5.00286C123.28 5.1739 125.839 7.86775 125.882 10.9037C125.926 13.4692 124.494 15.7783 122.195 16.7617C121.935 16.89 121.675 16.9755 121.545 17.0183C121.501 17.0183 121.501 17.0183 121.458 17.061C120.59 17.3604 119.94 18.2156 119.94 19.199C119.94 20.3535 120.807 21.2942 121.935 21.4225C125.622 21.8501 127.921 24.715 127.791 28.1358Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M54.1788 38.0987V1.19727H79.0343V4.91734H58.56V17.3176H70.1852V21.166H58.6034V34.3359H79.7717V38.0987" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M24.4217 4.91734H1.21458V1.19727H32.0996C23.9445 12.272 15.8763 23.2184 7.67787 34.3786H31.4923V38.0987H0C8.15502 27.024 16.2233 16.0776 24.4217 4.91734Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M224.697 0L205.307 38.1842H209.948C209.948 38.1842 212.898 32.54 214.026 30.1455H235.281C236.452 32.54 239.359 38.1842 239.359 38.1842H244L224.697 0ZM216.021 26.2116L224.697 8.68018L233.416 26.2543H216.021V26.2116Z" fill="currentColor"/><path d="M185.961 35.02C185.7 35.02 185.483 35.0628 185.266 35.0628C184.009 35.1056 182.967 34.678 182.143 33.7373C181.84 33.3952 181.579 33.0531 181.232 32.54C179.28 29.6751 177.372 26.853 175.246 23.6888C180.538 22.577 184.529 17.959 184.529 12.443C184.529 6.07185 179.237 0.940709 172.73 0.940709H156.637V38.3553H160.585V24.0308H170.952L171.299 24.544C171.993 25.5702 172.687 26.5964 173.338 27.6226C175.029 30.1882 176.808 32.8821 178.586 35.4904C179.931 37.4146 182.057 38.5263 184.442 38.5263C185.093 38.5263 185.7 38.4408 186.351 38.2698L186.524 38.227V35.02M172.73 20.3963H160.585V4.57527H172.73C177.198 4.57527 180.842 8.12431 180.842 12.4858C180.842 16.8472 177.198 20.3963 172.73 20.3963Z" fill="currentColor"/></svg>
    <span class="brand-sub">Reporte de Métricas</span>
    </h1>

    <div id="cliente">
      <p class="sub">Entra con el correo y la contraseña que te dimos.</p>
      <form id="pw-form">
        <div class="field">
          <label for="pw-email">Correo</label>
          <input id="pw-email" type="email" placeholder="tu@empresa.com" autocomplete="username" autofocus required>
        </div>
        <div class="field">
          <label for="pw-pass">Contraseña</label>
          <div class="wrap">
            <input id="pw-pass" type="password" placeholder="••••••••" autocomplete="current-password" required>
            <button class="peek" id="peek" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button class="primary" id="pw-btn" type="submit">Entrar</button>
      </form>
    </div>

    <div class="error" id="error" role="alert"></div>

    <div class="staff" id="staff">
      <p class="eyebrow">Equipo Zebra</p>
      <div class="gbtn" id="gbtn"></div>
      <div class="loading" id="loading">Cargando acceso…</div>
      <p class="alt" id="alt" hidden>¿No aparece el botón? <a href="/auth/google">Entrar con Google</a></p>
      <p class="hint" id="hint">Solo cuentas <b>@zebradigital.marketing</b></p>
    </div>
  </main>

<script>
const $err = document.getElementById('error');
const $loading = document.getElementById('loading');
const showError = (msg) => { $err.textContent = msg; $err.classList.add('show'); };

// Errores del flujo con redirección (el de respaldo), que vuelven por la URL.
const MENSAJES = {
  domain: 'Esa cuenta de Google no tiene acceso.',
  state: 'El inicio de sesión expiró o no es válido. Intenta de nuevo.',
  google: 'No se pudo completar el inicio con Google. Intenta de nuevo.',
};
const codigo = new URLSearchParams(location.search).get('error');
if (codigo) showError(MENSAJES[codigo] ?? MENSAJES.google);

// Ver la contraseña: la primera vez se teclea de un papel.
document.getElementById('peek').addEventListener('click', (e) => {
  const $p = document.getElementById('pw-pass');
  const ver = $p.type === 'password';
  $p.type = ver ? 'text' : 'password';
  e.currentTarget.setAttribute('aria-pressed', String(ver));
  e.currentTarget.setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
  $p.focus();
});

async function onCredential(response) {
  $err.classList.remove('show');
  try {
    const r = await fetch('/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential }),
    });
    if (r.ok) { location.replace('/'); return; }
    const data = await r.json().catch(() => ({}));
    showError(data.error || 'No se pudo iniciar sesión.');
    if (window.google) google.accounts.id.disableAutoSelect(); // permite reintentar con otra cuenta
  } catch {
    showError('Error de red al iniciar sesión. Intenta de nuevo.');
  }
}

document.getElementById('pw-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $err.classList.remove('show');
  const btn = document.getElementById('pw-btn');
  btn.disabled = true;
  try {
    const r = await fetch('/auth/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('pw-email').value, password: document.getElementById('pw-pass').value }),
    });
    if (r.ok) { location.replace('/'); return; }
    const data = await r.json().catch(() => ({}));
    showError(data.error || 'No se pudo iniciar sesión.');
    document.getElementById('pw-pass').select();
  } catch {
    showError('Error de red al iniciar sesión. Intenta de nuevo.');
  } finally { btn.disabled = false; }
});

async function init() {
  let cfg;
  try { cfg = await fetch('/auth/config').then((r) => r.json()); }
  catch { $loading.textContent = 'No se pudo cargar la configuración de acceso.'; return; }

  // Sin base del dashboard no hay usuarios con contraseña: solo queda la puerta del equipo.
  if (!cfg.contrasena) {
    document.getElementById('cliente').hidden = true;
    document.getElementById('staff').style.cssText = 'margin-top:0;padding-top:0;border-top:0';
  }
  if (Array.isArray(cfg.dominios) && cfg.dominios.length) {
    const hint = document.getElementById('hint');
    hint.textContent = 'Solo cuentas ';
    cfg.dominios.forEach((d, i) => {
      if (i) hint.append(' o ');
      const b = document.createElement('b'); b.textContent = '@' + d; hint.append(b);
    });
  }
  if (!cfg.clientId) { $loading.hidden = true; document.getElementById('alt').hidden = false; return; }

  // Si Identity Services no carga o no pinta (bloqueado, o el dominio sin autorizar en Google
  // Cloud), queda el flujo con redirección.
  const respaldo = setTimeout(() => {
    if (!document.getElementById('gbtn').childElementCount) { $loading.hidden = true; document.getElementById('alt').hidden = false; }
  }, 5000);
  const start = () => {
    if (!window.google?.accounts?.id) return setTimeout(start, 150);
    $loading.hidden = true;
    google.accounts.id.initialize({ client_id: cfg.clientId, callback: onCredential, auto_select: false, cancel_on_tap_outside: true });
    google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', width: Math.min(300, document.getElementById('gbtn').clientWidth || 300) });
    clearTimeout(respaldo);
  };
  start();
}

init();
</script>
</body>
</html>
